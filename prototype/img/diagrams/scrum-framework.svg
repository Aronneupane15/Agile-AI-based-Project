<text x="282.0" y="495.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Inspect people, process,</text>
<text x="282.0" y="516.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >tools; plan improvements</text>
<text x="282.0" y="537.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Closes the Sprint</text>
