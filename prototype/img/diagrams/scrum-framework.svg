<text x="352.0" y="251.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Up to 8 hrs for a</text>
<text x="352.0" y="272.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >1-month Sprint</text>
<rect x="592.0" y="170.0" width="220.0" height="150.0" rx="16" fill="#f5f5f7" stroke="none" stroke-width="1" filter="url(#sh)"/>
<rect x="592.0" y="170.0" width="6.0" height="150.0" rx="3" fill="#af52de" stroke="none" stroke-width="1" />
<text x="614.0" y="204.0" font-size="18" fill="#1d1d1f" font-weight="600" text-anchor="start" >Sprint Backlog</text>
<text x="614.0" y="230.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Sprint Goal + selected</text>
<text x="614.0" y="251.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >items + plan</text>
<text x="614.0" y="272.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Owned by Developers</text>
