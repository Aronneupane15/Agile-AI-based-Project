<text x="70.0" y="563.0" font-size="13" fill="#6e6e73" font-weight="400" text-anchor="start" >immediately</text>
<text x="48.0" y="640.0" font-size="15" fill="#1d1d1f" font-weight="700" text-anchor="start" >Scrum Team</text>
