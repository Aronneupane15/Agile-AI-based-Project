<text x="582.0" y="495.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Inspect the Increment</text>
<text x="582.0" y="516.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >with stakeholders,</text>
<text x="582.0" y="537.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >adapt Product Backlog</text>
<rect x="260.0" y="435.0" width="240.0" height="150.0" rx="16" fill="#f5f5f7" stroke="none" stroke-width="1" filter="url(#sh)"/>
<rect x="260.0" y="435.0" width="6.0" height="150.0" rx="3" fill="#ff9f0a" stroke="none" stroke-width="1" />
