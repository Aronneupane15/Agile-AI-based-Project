<text x="882.0" y="516.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Meets Definition of Done</text>
<text x="882.0" y="537.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Can release any time</text>
