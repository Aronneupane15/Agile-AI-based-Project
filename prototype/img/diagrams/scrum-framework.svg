<text x="74.0" y="700.0" font-size="13" fill="#6e6e73" font-weight="400" text-anchor="start" >maximizes value, orders backlog</text>
<circle cx="428" cy="674" r="8" fill="#af52de"/>
<text x="444.0" y="679.0" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start" >Scrum Master</text>
<text x="444.0" y="700.0" font-size="13" fill="#6e6e73" font-weight="400" text-anchor="start" >establishes Scrum, serves team</text>
<circle cx="798" cy="674" r="8" fill="#34c759"/>
<text x="814.0" y="679.0" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="start" >Developers</text>
<text x="814.0" y="700.0" font-size="13" fill="#6e6e73" font-weight="400" text-anchor="start" >create the Increment each Sprint</text>
<text x="1152.0" y="730.0" font-size="12" fill="#6e6e73" font-weight="400" text-anchor="end" >Based on The Scrum Guide (2020)</text>
