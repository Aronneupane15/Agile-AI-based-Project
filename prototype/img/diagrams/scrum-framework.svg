<text x="70.0" y="251.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Owned by Product Owner</text>
<text x="70.0" y="272.0" font-size="13.5" fill="#6e6e73" font-weight="400" text-anchor="start" >Commitment: Product Goal</text>
